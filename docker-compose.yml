version: '3.8'

services:
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    image: defect-risk-streamlit:latest
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - PYTHONUNBUFFERED=1

