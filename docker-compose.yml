version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: defect-risk-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: defect-risk-frontend:latest
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
